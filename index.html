<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Matthew Sawatzky | Projects</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600&display=swap');

    :root {
      --bg: #0b0d12;
      --panel: #121623;
      --muted: #c5cad3;
      --primary: #3ea2ff;
      --border: #1f2433;
      --card: #0f1320;
      --shadow: 0 20px 60px rgba(0, 0, 0, 0.45);
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: 'Space Grotesk', 'Segoe UI', sans-serif;
      background: radial-gradient(circle at 20% 20%, rgba(62, 162, 255, 0.08), transparent 25%), radial-gradient(circle at 80% 0%, rgba(62, 162, 255, 0.06), transparent 30%), var(--bg);
      color: white;
      padding: 48px 24px 64px;
      display: flex;
      justify-content: center;
    }

    .shell {
      width: min(1200px, 100%);
    }

    header {
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
      align-items: baseline;
      margin-bottom: 24px;
    }

    h1 {
      font-size: clamp(28px, 4vw, 36px);
      margin: 0;
      letter-spacing: -0.5px;
    }

    .tagline {
      color: var(--muted);
      font-size: 15px;
      margin: 2px 0 0;
    }

    .grid {
      display: grid;
      grid-template-columns: 1fr 1.3fr;
      gap: 18px;
    }

    .panel {
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 16px;
      box-shadow: var(--shadow);
      padding: 18px;
    }

    .repo-list {
      display: grid;
      gap: 12px;
    }

    .repo-card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 14px 14px 12px;
      display: grid;
      gap: 8px;
      cursor: pointer;
      transition: border-color 160ms ease, transform 160ms ease, background 160ms ease;
    }

    .repo-card:hover {
      border-color: rgba(62, 162, 255, 0.4);
      transform: translateY(-1px);
    }

    .repo-card.active {
      border-color: var(--primary);
      box-shadow: 0 12px 35px rgba(62, 162, 255, 0.2);
    }

    .repo-name {
      font-weight: 600;
      letter-spacing: -0.2px;
    }

    .meta {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
      font-size: 13px;
      color: var(--muted);
    }

    .pill {
      display: inline-flex;
      gap: 6px;
      align-items: center;
      background: rgba(62, 162, 255, 0.12);
      color: #cfe6ff;
      border-radius: 999px;
      padding: 6px 10px;
      font-weight: 500;
    }

    .description {
      color: var(--muted);
      font-size: 14px;
      line-height: 1.5;
    }

    .actions {
      display: flex;
      gap: 8px;
    }

    .button {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 10px 12px;
      border-radius: 10px;
      text-decoration: none;
      font-weight: 600;
      font-size: 14px;
      border: 1px solid var(--border);
      color: white;
      background: rgba(255, 255, 255, 0.03);
      transition: border-color 140ms ease, background 140ms ease;
    }

    .button.primary {
      background: linear-gradient(120deg, var(--primary), #5cd2ff);
      color: #05070b;
      border: none;
    }

    .button:hover {
      border-color: rgba(62, 162, 255, 0.4);
      background: rgba(62, 162, 255, 0.05);
    }

    .button.primary:hover {
      filter: brightness(0.98);
    }

    .readme-panel {
      display: grid;
      grid-template-rows: auto 1fr;
      gap: 12px;
      min-height: 420px;
    }

    .readme-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
    }

    .readme-title {
      font-weight: 600;
      letter-spacing: -0.2px;
    }

    .readme-body {
      background: #0c0f19;
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 14px;
      overflow: auto;
      white-space: pre-wrap;
      font-family: "SFMono-Regular", "Consolas", "Liberation Mono", monospace;
      font-size: 14px;
      line-height: 1.55;
      color: #e4e7f0;
      box-shadow: inset 0 0 0 1px rgba(255, 255, 255, 0.01);
    }

    .muted {
      color: var(--muted);
    }

    @media (max-width: 960px) {
      body { padding: 32px 18px 48px; }
      .grid { grid-template-columns: 1fr; }
      .readme-panel { min-height: 320px; }
    }
  </style>
</head>
<body>
  <div class="shell">
    <header>
      <h1>Selected Projects</h1>
      <p class="tagline">Live GitHub data with one-click READMEs.</p>
    </header>

    <section class="grid">
      <div class="panel">
        <div class="repo-list" id="repo-list"></div>
      </div>

      <div class="panel readme-panel">
        <div class="readme-header">
          <div>
            <div class="readme-title" id="readme-title">README</div>
            <div class="muted" id="readme-hint">Select a project to load its README.</div>
          </div>
        </div>
        <pre class="readme-body" id="readme-body">Waiting for selection…</pre>
      </div>
    </section>
  </div>

  <script>
    const repoTargets = [
      { owner: 'matthewsawatzky', name: 'burrowhost.com', label: 'burrowhost.com' },
      { owner: 'matthewsawatzky', name: 'LinkUp', label: 'LinkUp' },
      { owner: 'matthewsawatzky', name: 'HowTo-IT', label: 'HowTo-IT' },
      { owner: 'matthewsawatzky', name: 'LocalFileSharingApp', label: 'Local File Sharing App' },
    ];

    const repoListEl = document.getElementById('repo-list');
    const readmeTitleEl = document.getElementById('readme-title');
    const readmeBodyEl = document.getElementById('readme-body');
    const readmeHintEl = document.getElementById('readme-hint');

    const formatter = new Intl.NumberFormat('en', { notation: 'compact' });

    function createCard(repo) {
      const el = document.createElement('article');
      el.className = 'repo-card';
      el.innerHTML = `
        <div class="repo-name">${repo.label}</div>
        <div class="meta">
          <span class="pill" data-stars>★ 0</span>
          <span data-language>Language: —</span>
        </div>
        <div class="description" data-description>Loading description…</div>
        <div class="actions">
          <a class="button primary" data-github target="_blank" rel="noreferrer">GitHub</a>
          <a class="button" data-download target="_blank" rel="noreferrer">Download ZIP</a>
        </div>
      `;
      return el;
    }

    function setActiveCard(card) {
      document.querySelectorAll('.repo-card').forEach(c => c.classList.remove('active'));
      card.classList.add('active');
    }

    async function fetchRepoData(repo, card) {
      const descEl = card.querySelector('[data-description]');
      const starEl = card.querySelector('[data-stars]');
      const langEl = card.querySelector('[data-language]');
      const githubEl = card.querySelector('[data-github]');
      const downloadEl = card.querySelector('[data-download]');

      try {
        const res = await fetch(`https://api.github.com/repos/${repo.owner}/${repo.name}`);
        if (!res.ok) throw new Error('GitHub API unavailable');
        const data = await res.json();
        repo.description = data.description || 'No description provided yet.';
        repo.stars = data.stargazers_count || 0;
        repo.language = data.language || 'Unspecified';
        repo.defaultBranch = data.default_branch || 'main';
        repo.htmlUrl = data.html_url;
        repo.downloadUrl = `https://github.com/${repo.owner}/${repo.name}/archive/refs/heads/${repo.defaultBranch}.zip`;
      } catch (error) {
        repo.description = repo.description || 'Live data unavailable right now.';
        repo.stars = repo.stars || 0;
        repo.language = repo.language || 'Unknown';
        repo.defaultBranch = repo.defaultBranch || 'main';
        repo.htmlUrl = `https://github.com/${repo.owner}/${repo.name}`;
        repo.downloadUrl = `https://github.com/${repo.owner}/${repo.name}/archive/refs/heads/${repo.defaultBranch}.zip`;
      }

      descEl.textContent = repo.description;
      starEl.textContent = `★ ${formatter.format(repo.stars)}`;
      langEl.textContent = `Language: ${repo.language}`;
      githubEl.href = repo.htmlUrl;
      downloadEl.href = repo.downloadUrl;
    }

    async function loadReadme(repo) {
      readmeTitleEl.textContent = `${repo.label} — README`;
      readmeHintEl.textContent = '';
      readmeBodyEl.textContent = 'Loading README…';

      const branch = repo.defaultBranch || 'main';
      const url = `https://raw.githubusercontent.com/${repo.owner}/${repo.name}/${branch}/README.md`;

      try {
        const res = await fetch(url);
        if (!res.ok) throw new Error('README not reachable');
        const text = await res.text();
        readmeBodyEl.textContent = text || 'README is empty.';
      } catch (error) {
        readmeBodyEl.textContent = 'Unable to load README right now.';
      }
    }

    repoTargets.forEach(repo => {
      const card = createCard(repo);
      repoListEl.appendChild(card);

      fetchRepoData(repo, card);

      card.addEventListener('click', () => {
        setActiveCard(card);
        loadReadme(repo);
      });

      card.querySelector('[data-github]').addEventListener('click', e => e.stopPropagation());
      card.querySelector('[data-download]').addEventListener('click', e => e.stopPropagation());
    });
  </script>
</body>
</html>
